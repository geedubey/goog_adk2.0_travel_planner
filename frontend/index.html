<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderlust AI - Google ADK Multi-Agent Concierge</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Marked for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .prose h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
    .prose h2 { font-size: 1.25rem; font-weight: 700; color: #1e293b; margin-top: 1.25rem; margin-bottom: 0.5rem; }
    .prose h3 { font-size: 1.05rem; font-weight: 600; color: #334155; margin-top: 1rem; margin-bottom: 0.25rem; }
    .prose p { margin-top: 0.5rem; margin-bottom: 0.5rem; line-height: 1.65; color: #334155; }
    .prose ul, .prose ol { padding-left: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .prose li { margin-top: 0.25rem; margin-bottom: 0.25rem; }
    .prose table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
    .prose th, .prose td { border: 1px solid #e2e8f0; padding: 0.6rem 0.75rem; text-align: left; }
    .prose th { background: #f8fafc; font-weight: 600; color: #1e293b; }
    .prose strong { color: #0f172a; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased flex flex-col font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Sample fallback itinerary if LLM key is missing or offline
    const SAMPLE_ITINERARY = `# 🌟 Master Itinerary: 4-Day Cultural & Culinary Tour in Paris

**Prepared by:** Lead Trip Concierge & Multi-Agent Swarm (Flight, Hotel & Sightseeing Specialists)  
**Dates:** May 10, 2026 – May 13, 2026 | **Total Budget:** $800 USD | **Style:** Balanced Comfort

---

### ✈️ Flight Arrangements (Confirmed by Flight Specialist)
* **Outbound:** AF1681 • London (LHR) ➔ Paris (CDG) | Depart: 08:30 – Arrive: 10:45 | **$105**
* **Return:** BA304 • Paris (CDG) ➔ London (LHR) | Depart: 18:00 – Arrive: 18:20 | **$95**
* **Total Flight Cost:** **$200 USD** (Within 25% target allocation)

---

### 🏨 Accommodations (Curated by Hotel Specialist)
* **Hotel:** Hôtel Le Marais Boutique (3-Star Boutique)
* **Location:** 4th Arrondissement (Near historic center, walk to culinary spots)
* **Rate:** $110/night × 3 nights = **$330 USD**
* **Amenities:** Free Wi-Fi, Breakfast included, 24/7 concierge

---

### 🗺️ Day-by-Day Experience (Curated by City Guide & Sightseeing Specialist)

#### Day 1: Historic Heart & Seine River
* **Morning:** Arrival at CDG via AF1681, RER B express transit to Le Marais ($12). Check-in & refresh.
* **Afternoon:** Stroll Île de la Cité, visit **Notre-Dame Cathedral** and Sainte-Chapelle ($14).
* **Evening:** Traditional French bistro dinner at *Chez Janou* (duck confit & chocolate mousse).

#### Day 2: Arts & Architecture
* **Morning:** Early entry to **The Louvre Museum** ($18) – Winged Victory, Mona Lisa, Apollo Gallery.
* **Afternoon:** Stroll through Jardin des Tuileries toward Place de la Concorde. Artisanal crêpe lunch.
* **Evening:** Sunset panoramic view from **Montmartre & Sacré-Cœur Basilica**; explore street artists.

#### Day 3: Iconic Landmarks & Culinary Tastings
* **Morning:** Ascent to **Eiffel Tower 2nd Level** ($20). Photos from Trocadéro Gardens.
* **Afternoon:** Food tasting tour through Marché des Enfants Rouges (cheeses, baguettes, pastries).
* **Evening:** Relaxing 1-hour **Seine River Cruise** on Vedettes du Pont Neuf ($16).

#### Day 4: Marais Boutiques & Departure
* **Morning:** Leisurely espresso and croissant at Place des Vosges; browse local perfumeries.
* **Afternoon:** Transit back to CDG for return flight BA304 departing 18:00.

---

### 💰 Final Budget Breakdown
| Category | Allocated Cost | Remaining Funds | Status |
| :--- | :--- | :--- | :--- |
| **Flights (Round-trip)** | $200 | $600 | ✅ Reserved |
| **Hotel (3 Nights)** | $330 | $270 | ✅ Booked |
| **Sightseeing & Museums** | $75 | $195 | ✅ Scheduled |
| **Meals & Dining** | $140 | $55 | ✅ Within Budget |
| **Local Transit & Buffer** | $40 | **$15 USD (Buffer)** | ✅ Balanced |
| **TOTAL** | **$785 USD** | **$15 USD Under Budget** | **PERFECT MATCH** |
`;

    function App() {
      // Configuration
      const defaultHost = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
        ? "192.168.29.21"
        : window.location.hostname;
      const [apiUrl, setApiUrl] = useState(`http://${defaultHost}:8000`);
      const [appName, setAppName] = useState("caps_travel_planner");
      const [userId, setUserId] = useState("traveler_1");
      const [sessionId, setSessionId] = useState(null);

      // Form State
      const [origin, setOrigin] = useState("London (LHR)");
      const [destination, setDestination] = useState("Paris (CDG)");
      const [startDate, setStartDate] = useState("2026-05-10");
      const [endDate, setEndDate] = useState("2026-05-13");
      const [budget, setBudget] = useState(800);
      const [style, setStyle] = useState("Balanced");
      const [notes, setNotes] = useState("Near historic center, interested in cultural landmarks and culinary spots.");

      // Execution State
      const [loading, setLoading] = useState(false);
      const [currentStep, setCurrentStep] = useState(0); // 0: Idle, 1: Swarm Init, 2: Flights, 3: Hotels, 4: Sights, 5: Complete
      const [agentEvents, setAgentEvents] = useState([]);
      const [liveThoughts, setLiveThoughts] = useState([]);
      const [itineraryText, setItineraryText] = useState("");
      const [activeTab, setActiveTab] = useState("itinerary"); // 'itinerary' | 'feed' | 'budget' | 'debug'
      const [serverConnected, setServerConnected] = useState(null);
      const [errorMessage, setErrorMessage] = useState(null);

      // Live Agent States
      const [agentStatus, setAgentStatus] = useState({
        concierge: { state: "idle", detail: "Ready to orchestrate" },
        flight: { state: "idle", detail: "Awaiting delegation" },
        hotel: { state: "idle", detail: "Awaiting delegation" },
        sightseeing: { state: "idle", detail: "Awaiting delegation" }
      });

      // Auto-check server on mount and when apiUrl changes
      useEffect(() => {
        checkServer();
      }, [apiUrl]);

      const checkServer = async () => {
        try {
          const res = await fetch(`${apiUrl}/list-apps`);
          if (res.ok) {
            const apps = await res.json();
            if (Array.isArray(apps) && apps.length > 0) {
              setAppName(apps[0]);
            }
            setServerConnected(true);
          } else {
            setServerConnected(false);
          }
        } catch (e) {
          setServerConnected(false);
        }
      };

      const getOrCreateSession = async () => {
        if (sessionId) return sessionId;
        try {
          const res = await fetch(`${apiUrl}/apps/${appName}/users/${userId}/sessions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          setSessionId(data.id);
          return data.id;
        } catch (e) {
          const fallback = "sess-" + Math.random().toString(36).substring(2, 9);
          setSessionId(fallback);
          return fallback;
        }
      };

      const addThought = (agent, text, icon = "💡") => {
        setLiveThoughts(prev => [
          { agent, text, icon, time: new Date().toLocaleTimeString() },
          ...prev.slice(0, 40)
        ]);
      };

      const handlePlanTrip = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        setErrorMessage(null);
        setItineraryText("");
        setAgentEvents([]);
        setLiveThoughts([]);
        setCurrentStep(1);

        setAgentStatus({
          concierge: { state: "active", detail: "Decomposing travel prompt..." },
          flight: { state: "waiting", detail: "Queued for flight search" },
          hotel: { state: "waiting", detail: "Queued for accommodation search" },
          sightseeing: { state: "waiting", detail: "Queued for attractions & weather" }
        });

        addThought("Trip Concierge", "Analyzing parameters: origin, destination, budget & preferences...", "🧠");

        const curSession = await getOrCreateSession();
        const userPrompt = `Plan a ${style.toLowerCase()} vacation from ${origin} to ${destination} from ${startDate} to ${endDate} with a total budget of $${budget}. Notes: ${notes}. Please delegate to flight, hotel, and sightseeing specialists to generate a complete day-by-day itinerary with budget breakdown.`;

        try {
          const response = await fetch(`${apiUrl}/run_sse`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              app_name: appName,
              user_id: userId,
              session_id: curSession,
              new_message: {
                role: "user",
                parts: [{ text: userPrompt }]
              },
              streaming: true
            })
          });

          if (!response.ok) {
            throw new Error(`ADK Server returned status ${response.status} (${response.statusText})`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";
          let accumulatedMarkdown = "";
          let receivedAnyText = false;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || !trimmed.startsWith("data:")) continue;
              const jsonStr = trimmed.replace(/^data:\s*/, "");
              if (!jsonStr || jsonStr === "[DONE]") continue;

              try {
                const event = JSON.parse(jsonStr);
                setAgentEvents(prev => [...prev, { ...event, timestamp: new Date().toLocaleTimeString() }]);

                // Check for LLM errors inside ADK event
                if (event.errorMessage || event.errorCode || event.error) {
                  const errText = event.errorMessage || event.error || `Error code ${event.errorCode}`;
                  setErrorMessage(errText);
                  addThought("System Error", errText, "⚠️");
                }

                const author = event.author || "trip_concierge";

                // Update Stepper & Agent Cards based on author & actions
                if (author.includes("flight")) {
                  setCurrentStep(2);
                  setAgentStatus(prev => ({
                    ...prev,
                    flight: { state: "active", detail: "Comparing airline fares & schedules" }
                  }));
                } else if (author.includes("hotel")) {
                  setCurrentStep(3);
                  setAgentStatus(prev => ({
                    ...prev,
                    hotel: { state: "active", detail: "Finding hotels within target budget" }
                  }));
                } else if (author.includes("sightseeing")) {
                  setCurrentStep(4);
                  setAgentStatus(prev => ({
                    ...prev,
                    sightseeing: { state: "active", detail: "Checking weather & top landmarks" }
                  }));
                }

                // Process Parts (Handles both camelCase & snake_case from Pydantic)
                if (event.content && event.content.parts) {
                  for (const part of event.content.parts) {
                    // 1. Tool Call
                    const fnCall = part.functionCall || part.function_call;
                    if (fnCall) {
                      addThought(author, `Invoking tool: ${fnCall.name}(${JSON.stringify(fnCall.args || {})})`, "⚙️");
                    }

                    // 2. Tool Response
                    const fnResp = part.functionResponse || part.function_response;
                    if (fnResp) {
                      addThought(author, `Tool ${fnResp.name} returned results`, "📥");
                    }

                    // 3. Thinking / Thought (Gemini 2.0 / 3.8 Flash Thinking)
                    if (part.thought) {
                      addThought(author, part.thought, "💭");
                    }

                    // 4. Text Stream
                    if (part.text) {
                      receivedAnyText = true;
                      accumulatedMarkdown += part.text;
                      setItineraryText(accumulatedMarkdown);
                    }
                  }
                }

                // Also check if text is directly in event.output or event.text
                if (event.output && typeof event.output === "string") {
                  receivedAnyText = true;
                  accumulatedMarkdown += event.output;
                  setItineraryText(accumulatedMarkdown);
                }

              } catch (parseErr) {
                console.warn("SSE Event parse error:", parseErr, jsonStr);
              }
            }
          }

          // Complete workflow
          setCurrentStep(5);
          setAgentStatus({
            concierge: { state: "done", detail: "Master plan synthesized" },
            flight: { state: "done", detail: "Flight options finalized" },
            hotel: { state: "done", detail: "Lodging options selected" },
            sightseeing: { state: "done", detail: "Attractions & weather curated" }
          });
          addThought("Trip Concierge", "Multi-agent synthesis complete!", "🎉");

          // If stream finished but no text was generated (e.g. LLM auth failure or empty response)
          if (!receivedAnyText && !accumulatedMarkdown) {
            setErrorMessage("The swarm completed the turn, but the model did not generate output text. Check that your LLM provider (Ollama or Gemini) is responding.");
          }

        } catch (err) {
          console.error("Agent error:", err);
          setErrorMessage(err.message);
          addThought("Trip Concierge", `Connection error: ${err.message}`, "❌");
        } finally {
          setLoading(false);
        }
      };

      const loadSamplePlan = () => {
        setItineraryText(SAMPLE_ITINERARY);
        setErrorMessage(null);
        setCurrentStep(5);
        setActiveTab("itinerary");
        setAgentStatus({
          concierge: { state: "done", detail: "Sample itinerary loaded" },
          flight: { state: "done", detail: "Air France AF1681 & BA304 ($200)" },
          hotel: { state: "done", detail: "Hôtel Le Marais 3-star ($330)" },
          sightseeing: { state: "done", detail: "Louvre, Eiffel Tower, Notre-Dame ($75)" }
        });
        addThought("System", "Loaded realistic multi-agent verified sample plan.", "📋");
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-50">
          {/* Top Navigation */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm backdrop-blur-md bg-white/95">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md text-xl">
                  ✈️
                </div>
                <div>
                  <h1 className="text-base font-bold text-slate-900 tracking-tight flex items-center gap-2">
                    Wanderlust AI Concierge
                    <span className="text-[10px] bg-brand-50 text-brand-700 font-mono px-2 py-0.5 rounded-full border border-brand-200">
                      Google ADK Swarm
                    </span>
                  </h1>
                  <p className="text-xs text-slate-500">Autonomous Multi-Agent Travel Planning System</p>
                </div>
              </div>

              {/* Endpoint Controls & Actions */}
              <div className="flex items-center space-x-3">
                <div className="flex items-center space-x-2 text-xs bg-slate-100 py-1 px-3 rounded-full border border-slate-200">
                  <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${
                    serverConnected === true ? "bg-emerald-500 shadow-sm shadow-emerald-400" : "bg-rose-500 animate-pulse"
                  }`}></span>
                  <span className="font-semibold text-slate-500 text-[10px] uppercase tracking-wider">ADK API:</span>
                  <input
                    type="text"
                    value={apiUrl}
                    onChange={(e) => setApiUrl(e.target.value)}
                    className="font-mono text-xs bg-white border border-slate-300 rounded px-2 py-0.5 text-slate-800 w-52 focus:outline-none focus:ring-1 focus:ring-brand-500"
                    placeholder="http://192.168.29.21:8000"
                    title="Change ADK Server Endpoint"
                  />
                </div>

                <button
                  onClick={loadSamplePlan}
                  className="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow-sm"
                  title="Preview with sample multi-agent itinerary"
                >
                  <span>✨ Sample Plan</span>
                </button>

                <button
                  onClick={() => { setSessionId(null); setItineraryText(""); setAgentEvents([]); setLiveThoughts([]); setCurrentStep(0); setErrorMessage(null); }}
                  className="text-xs text-slate-600 hover:text-slate-900 font-medium px-2.5 py-1.5 rounded-lg hover:bg-slate-100 transition"
                >
                  Reset
                </button>
              </div>
            </div>
          </header>

          {/* Stepper Pipeline Bar */}
          <div className="bg-slate-900 text-white py-2.5 px-4 shadow-inner">
            <div className="max-w-7xl mx-auto flex items-center justify-between text-xs">
              <div className="flex items-center space-x-2">
                <span className="font-bold text-indigo-400 uppercase tracking-wider text-[10px]">Swarm Lifecycle:</span>
              </div>
              <div className="flex items-center space-x-4 sm:space-x-8 overflow-x-auto py-1">
                <div className={`flex items-center space-x-1.5 ${currentStep >= 1 ? "text-indigo-300 font-bold" : "text-slate-500"}`}>
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${currentStep >= 1 ? "bg-indigo-600 text-white" : "bg-slate-800"}`}>1</span>
                  <span>Concierge</span>
                </div>
                <span className="text-slate-600">➔</span>
                <div className={`flex items-center space-x-1.5 ${currentStep >= 2 ? "text-sky-300 font-bold" : "text-slate-500"}`}>
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${currentStep >= 2 ? "bg-sky-600 text-white" : "bg-slate-800"}`}>2</span>
                  <span>Flight Agent</span>
                </div>
                <span className="text-slate-600">➔</span>
                <div className={`flex items-center space-x-1.5 ${currentStep >= 3 ? "text-amber-300 font-bold" : "text-slate-500"}`}>
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${currentStep >= 3 ? "bg-amber-600 text-white" : "bg-slate-800"}`}>3</span>
                  <span>Hotel Agent</span>
                </div>
                <span className="text-slate-600">➔</span>
                <div className={`flex items-center space-x-1.5 ${currentStep >= 4 ? "text-emerald-300 font-bold" : "text-slate-500"}`}>
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${currentStep >= 4 ? "bg-emerald-600 text-white" : "bg-slate-800"}`}>4</span>
                  <span>City Guide</span>
                </div>
                <span className="text-slate-600">➔</span>
                <div className={`flex items-center space-x-1.5 ${currentStep >= 5 ? "text-purple-300 font-bold" : "text-slate-500"}`}>
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${currentStep >= 5 ? "bg-purple-600 text-white" : "bg-slate-800"}`}>5</span>
                  <span>Master Plan</span>
                </div>
              </div>
            </div>
          </div>

          {/* Main Workspace */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
            
            {/* Left Column: Form & Swarm Roster (5 Cols) */}
            <div className="lg:col-span-5 space-y-5">
              
              {/* Travel Parameters Form */}
              <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                  <h2 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                    <span>🧭</span> Trip Parameters
                  </h2>
                  <span className="text-[11px] font-mono text-slate-500">
                    ADK Session: {sessionId ? sessionId.substring(0, 8) : "Ready"}
                  </span>
                </div>

                <form onSubmit={handlePlanTrip} className="space-y-3.5">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Origin</label>
                      <input
                        type="text"
                        value={origin}
                        onChange={(e) => setOrigin(e.target.value)}
                        className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium"
                        placeholder="e.g. London"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Destination</label>
                      <input
                        type="text"
                        value={destination}
                        onChange={(e) => setDestination(e.target.value)}
                        className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium"
                        placeholder="e.g. Paris"
                        required
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Departure</label>
                      <input
                        type="date"
                        value={startDate}
                        onChange={(e) => setStartDate(e.target.value)}
                        className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Return</label>
                      <input
                        type="date"
                        value={endDate}
                        onChange={(e) => setEndDate(e.target.value)}
                        className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium"
                        required
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Budget ($ USD)</label>
                      <input
                        type="number"
                        value={budget}
                        onChange={(e) => setBudget(e.target.value)}
                        min="200"
                        max="20000"
                        step="50"
                        className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Travel Style</label>
                      <select
                        value={style}
                        onChange={(e) => setStyle(e.target.value)}
                        className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium"
                      >
                        <option value="Budget">Budget Backpacker</option>
                        <option value="Balanced">Balanced Comfort</option>
                        <option value="Luxury">Luxury & Fine Dining</option>
                        <option value="Family">Family Friendly</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Special Preferences</label>
                    <textarea
                      rows="2"
                      value={notes}
                      onChange={(e) => setNotes(e.target.value)}
                      className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium"
                      placeholder="e.g. Walking tours, quiet neighborhood, vegetarian food..."
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full py-3 px-4 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-bold text-xs rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2 disabled:opacity-50"
                  >
                    {loading ? (
                      <>
                        <svg className="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                        <span>Swarm Orchestrating Plan...</span>
                      </>
                    ) : (
                      <>
                        <span>🚀 Launch ADK Swarm & Plan Vacation</span>
                      </>
                    )}
                  </button>
                </form>
              </div>

              {/* Live Multi-Agent Swarm Mission Control */}
              <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
                    <span>🤖</span> Multi-Agent Roster (Live Telemetry)
                  </h3>
                  <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-mono">
                    4 Agents Active
                  </span>
                </div>

                <div className="space-y-2 text-xs">
                  {/* Concierge Card */}
                  <div className={`p-3 rounded-xl border transition-all ${
                    agentStatus.concierge.state === "active" ? "bg-indigo-50 border-indigo-300 text-indigo-900 shadow-sm" :
                    agentStatus.concierge.state === "done" ? "bg-emerald-50/50 border-emerald-200 text-slate-800" :
                    "bg-slate-50 border-slate-200 text-slate-600"
                  }`}>
                    <div className="flex items-center justify-between font-semibold">
                      <div className="flex items-center space-x-2">
                        <span>🧠</span>
                        <span>Trip Concierge (Orchestrator)</span>
                      </div>
                      <span className={`text-[10px] font-mono uppercase px-2 py-0.5 rounded-full ${
                        agentStatus.concierge.state === "active" ? "bg-indigo-200 text-indigo-800 animate-pulse" :
                        agentStatus.concierge.state === "done" ? "bg-emerald-200 text-emerald-800" : "bg-slate-200 text-slate-600"
                      }`}>
                        {agentStatus.concierge.state}
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-500 mt-1 pl-6">
                      {agentStatus.concierge.detail}
                    </div>
                  </div>

                  {/* Flight Specialist Card */}
                  <div className={`p-3 rounded-xl border transition-all ${
                    agentStatus.flight.state === "active" ? "bg-sky-50 border-sky-300 text-sky-900 shadow-sm" :
                    agentStatus.flight.state === "done" ? "bg-emerald-50/50 border-emerald-200 text-slate-800" :
                    "bg-slate-50 border-slate-200 text-slate-600"
                  }`}>
                    <div className="flex items-center justify-between font-semibold">
                      <div className="flex items-center space-x-2">
                        <span>✈️</span>
                        <span>Flight Specialist (Subagent)</span>
                      </div>
                      <span className={`text-[10px] font-mono uppercase px-2 py-0.5 rounded-full ${
                        agentStatus.flight.state === "active" ? "bg-sky-200 text-sky-800 animate-pulse" :
                        agentStatus.flight.state === "done" ? "bg-emerald-200 text-emerald-800" : "bg-slate-200 text-slate-600"
                      }`}>
                        {agentStatus.flight.state}
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-500 mt-1 pl-6">
                      {agentStatus.flight.detail}
                    </div>
                  </div>

                  {/* Hotel Specialist Card */}
                  <div className={`p-3 rounded-xl border transition-all ${
                    agentStatus.hotel.state === "active" ? "bg-amber-50 border-amber-300 text-amber-900 shadow-sm" :
                    agentStatus.hotel.state === "done" ? "bg-emerald-50/50 border-emerald-200 text-slate-800" :
                    "bg-slate-50 border-slate-200 text-slate-600"
                  }`}>
                    <div className="flex items-center justify-between font-semibold">
                      <div className="flex items-center space-x-2">
                        <span>🏨</span>
                        <span>Hotel Specialist (Subagent)</span>
                      </div>
                      <span className={`text-[10px] font-mono uppercase px-2 py-0.5 rounded-full ${
                        agentStatus.hotel.state === "active" ? "bg-amber-200 text-amber-800 animate-pulse" :
                        agentStatus.hotel.state === "done" ? "bg-emerald-200 text-emerald-800" : "bg-slate-200 text-slate-600"
                      }`}>
                        {agentStatus.hotel.state}
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-500 mt-1 pl-6">
                      {agentStatus.hotel.detail}
                    </div>
                  </div>

                  {/* City Guide Card */}
                  <div className={`p-3 rounded-xl border transition-all ${
                    agentStatus.sightseeing.state === "active" ? "bg-emerald-50 border-emerald-300 text-emerald-900 shadow-sm" :
                    agentStatus.sightseeing.state === "done" ? "bg-emerald-50/50 border-emerald-200 text-slate-800" :
                    "bg-slate-50 border-slate-200 text-slate-600"
                  }`}>
                    <div className="flex items-center justify-between font-semibold">
                      <div className="flex items-center space-x-2">
                        <span>☀️</span>
                        <span>City Guide Specialist (Subagent)</span>
                      </div>
                      <span className={`text-[10px] font-mono uppercase px-2 py-0.5 rounded-full ${
                        agentStatus.sightseeing.state === "active" ? "bg-emerald-200 text-emerald-800 animate-pulse" :
                        agentStatus.sightseeing.state === "done" ? "bg-emerald-200 text-emerald-800" : "bg-slate-200 text-slate-600"
                      }`}>
                        {agentStatus.sightseeing.state}
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-500 mt-1 pl-6">
                      {agentStatus.sightseeing.detail}
                    </div>
                  </div>
                </div>
              </div>

              {/* Real-time Thought Stream Feed */}
              <div className="bg-slate-900 rounded-2xl p-4 text-white shadow-sm space-y-2.5">
                <div className="flex items-center justify-between text-xs pb-2 border-b border-slate-800">
                  <span className="font-bold text-indigo-400 flex items-center gap-1.5 text-[11px] uppercase tracking-wider">
                    <span>⚡</span> Live Swarm Activity Stream
                  </span>
                  <span className="text-[10px] text-slate-400 font-mono">
                    {liveThoughts.length} Steps Logged
                  </span>
                </div>
                <div className="max-h-56 overflow-y-auto space-y-2 pr-1 text-xs">
                  {liveThoughts.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-xs">
                      Click "Launch ADK Swarm" to observe real-time agent thoughts & tool executions.
                    </div>
                  ) : (
                    liveThoughts.map((t, idx) => (
                      <div key={idx} className="bg-slate-800/90 rounded-lg p-2.5 border border-slate-700/60 space-y-1">
                        <div className="flex items-center justify-between text-[10px]">
                          <span className="font-bold text-indigo-300 flex items-center gap-1">
                            <span>{t.icon}</span>
                            <span>{t.agent}</span>
                          </span>
                          <span className="text-slate-500 font-mono">{t.time}</span>
                        </div>
                        <p className="text-slate-300 text-[11px] font-mono leading-relaxed break-words">
                          {t.text}
                        </p>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>

            {/* Right Column: Master Itinerary & Analysis (7 Cols) */}
            <div className="lg:col-span-7 flex flex-col space-y-4">
              
              {/* Tab Navigation */}
              <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                <div className="flex space-x-2">
                  <button
                    onClick={() => setActiveTab("itinerary")}
                    className={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${
                      activeTab === "itinerary" ? "bg-brand-600 text-white shadow-sm" : "text-slate-600 hover:bg-slate-100"
                    }`}
                  >
                    📋 Master Itinerary
                  </button>
                  <button
                    onClick={() => setActiveTab("feed")}
                    className={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${
                      activeTab === "feed" ? "bg-brand-600 text-white shadow-sm" : "text-slate-600 hover:bg-slate-100"
                    }`}
                  >
                    ⚡ Execution Timeline ({liveThoughts.length})
                  </button>
                  <button
                    onClick={() => setActiveTab("debug")}
                    className={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${
                      activeTab === "debug" ? "bg-brand-600 text-white shadow-sm" : "text-slate-600 hover:bg-slate-100"
                    }`}
                  >
                    🔍 ADK Events ({agentEvents.length})
                  </button>
                </div>

                {itineraryText && (
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => navigator.clipboard.writeText(itineraryText)}
                      className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-2.5 py-1 rounded-md transition flex items-center gap-1"
                    >
                      <span>📋 Copy</span>
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-2.5 py-1 rounded-md transition flex items-center gap-1"
                    >
                      <span>🖨️ Print</span>
                    </button>
                  </div>
                )}
              </div>

              {/* Error Notice Banner */}
              {errorMessage && (
                <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4 text-rose-900 space-y-2 animate-shake">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2 font-bold text-sm text-rose-700">
                      <span>⚠️</span>
                      <span>Agent Execution Diagnostic Notice</span>
                    </div>
                    <button
                      onClick={loadSamplePlan}
                      className="text-xs bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded-md font-semibold transition"
                    >
                      Load Sample Output
                    </button>
                  </div>
                  <p className="text-xs font-mono bg-rose-100/70 p-2.5 rounded-lg border border-rose-200 leading-relaxed">
                    {errorMessage}
                  </p>
                  <p className="text-[11px] text-rose-700">
                    <strong>Solution:</strong> Ensure Ollama is running on your RTX 4060 at <code className="bg-rose-100 px-1 py-0.5 rounded font-mono">http://192.168.29.21:11434</code>, or paste a free Gemini API key into <code className="bg-rose-100 px-1 py-0.5 rounded font-mono">.env</code>.
                  </p>
                </div>
              )}

              {/* Tab 1: Master Markdown Itinerary */}
              {activeTab === "itinerary" && (
                <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm flex-1 min-h-[550px] transition-all">
                  {itineraryText ? (
                    <div
                      className="prose max-w-none text-slate-800 text-sm leading-relaxed"
                      dangerouslySetInnerHTML={{ __html: marked.parse(itineraryText) }}
                    />
                  ) : (
                    <div className="h-full flex flex-col items-center justify-center text-center py-24 text-slate-400 space-y-4">
                      <div className="w-20 h-20 rounded-2xl bg-gradient-to-tr from-brand-50 to-indigo-100 border border-brand-200 flex items-center justify-center text-4xl shadow-sm">
                        🏖️
                      </div>
                      <div className="max-w-md space-y-1">
                        <h4 className="font-bold text-slate-800 text-base">Master Itinerary Workspace</h4>
                        <p className="text-xs text-slate-500 leading-relaxed">
                          Your comprehensive multi-agent travel plan will stream live here as Flight, Hotel, and Sightseeing agents complete their specialized tasks.
                        </p>
                      </div>
                      <div className="flex gap-2 pt-2">
                        <button
                          onClick={handlePlanTrip}
                          className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow transition"
                        >
                          🚀 Run Swarm Now
                        </button>
                        <button
                          onClick={loadSamplePlan}
                          className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-200 transition"
                        >
                          ✨ Load Sample Preview
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Tab 2: Execution Timeline Feed */}
              {activeTab === "feed" && (
                <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex-1 min-h-[550px] space-y-3 overflow-y-auto">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-700 pb-2 border-b border-slate-100">
                    Step-by-Step Swarm Execution Timeline
                  </h3>
                  {liveThoughts.length === 0 ? (
                    <div className="text-center py-20 text-slate-400 text-xs">
                      No execution logs yet. Trigger a trip query to inspect the swarm.
                    </div>
                  ) : (
                    liveThoughts.map((t, idx) => (
                      <div key={idx} className="flex space-x-3 text-xs p-3 rounded-xl bg-slate-50 border border-slate-200">
                        <span className="text-lg">{t.icon}</span>
                        <div className="flex-1 space-y-0.5">
                          <div className="flex items-center justify-between font-bold text-slate-800">
                            <span>{t.agent}</span>
                            <span className="text-[10px] text-slate-400 font-mono">{t.time}</span>
                          </div>
                          <p className="text-slate-600 font-mono text-[11px] leading-relaxed">{t.text}</p>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* Tab 3: Raw ADK SSE Event Inspector */}
              {activeTab === "debug" && (
                <div className="bg-slate-900 rounded-2xl border border-slate-800 p-4 font-mono text-xs text-slate-200 flex-1 min-h-[550px] max-h-[750px] overflow-y-auto space-y-2">
                  <div className="text-[11px] text-slate-400 pb-2 border-b border-slate-800 flex justify-between">
                    <span>RAW SSE EVENT STREAM (/run_sse)</span>
                    <span>Total Events: {agentEvents.length}</span>
                  </div>
                  {agentEvents.length === 0 ? (
                    <div className="py-24 text-center text-slate-500">
                      No raw events captured yet.
                    </div>
                  ) : (
                    agentEvents.map((ev, i) => (
                      <div key={i} className="p-2.5 rounded-lg bg-slate-800/90 border border-slate-700/60 space-y-1">
                        <div className="flex items-center justify-between text-[11px] text-indigo-400 font-bold">
                          <span>[{ev.author || "Agent"}]</span>
                          <span className="text-slate-500 font-normal">{ev.timestamp}</span>
                        </div>
                        <pre className="text-slate-300 text-[10px] overflow-x-auto p-2 bg-slate-950 rounded">
                          {JSON.stringify(ev, null, 2)}
                        </pre>
                      </div>
                    ))
                  )}
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
